[project]
name = "hvac-agent"
version = "0.0.0"
description = "A standalone data-center HVAC agent system for one DGX Spark installation."
requires-python = ">=3.11"

# No runtime dependencies yet. Frameworks, models, and storage remain open choices.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Discover only the backend package, never apps, tests, or installation artifacts.
[tool.setuptools.packages.find]
where = ["src"]
include = ["hvac_agent*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
